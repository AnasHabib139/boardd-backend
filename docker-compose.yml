version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb_boardd
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - boardd-network

  redis:
    image: redis:7-alpine
    container_name: redis_boardd
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - boardd-network
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:

networks:
  boardd-network:
    driver: bridge
