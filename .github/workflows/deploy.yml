name: Deploy to EC2

on:
  push:
    branches: [main] # Triggers when you push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to your project directory
            cd /home/ubuntu/boardd-backend

            # Ensure deploy key permissions are correct
            chmod 600 ~/.ssh/boardd_deploy_key

            # Set SSH command for git operations
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/boardd_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

            # Pull latest changes from private repository
            git pull origin main

            # Install/update dependencies
            npm install --production

            # Run database migrations if any
            if [ -f "scripts/migrate.js" ]; then
              node scripts/migrate.js
            fi

            # Restart PM2
            pm2 restart backend

            # Show status to confirm deployment
            pm2 status

            echo "🚀 Deployment completed successfully!"
